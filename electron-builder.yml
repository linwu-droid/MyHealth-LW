icon: build/icon.ico
appId: com.myhealthlw.app
productName: MyHealth
copyright: Copyright (c) RevoCon (TM) - L.W.
directories:
  buildResources: build
  output: release
files:
  - '!src/*'
  - '!scripts{,/**/*}'
  - '!.agent-work{,/**/*}'
  - '!*.cmd'
asarUnpack:
  - resources/**
win:
  icon: build/icon.ico
  executableName: MyHealth
  target:
    - target: nsis
      arch:
        - x64
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: MyHealth-${version}-setup.${ext}
  shortcutName: MyHealth
  uninstallDisplayName: MyHealth
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
mac:
  notarize: false
linux:
  target:
    - AppImage
  maintainer: RevoCon - L.W.
  category: Utility
publish:
  provider: github
  owner: linwu-droid
  repo: MyHealth-LW
npmRebuild: false
